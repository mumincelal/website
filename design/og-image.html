<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Source for public/og-image.png (render at 1200×630) (1200×630). Re-render after changing the name or headline. -->
<!-- Same self-hosted fonts as the site (run `npm install` first). -->
<link rel="stylesheet" href="../node_modules/@fontsource-variable/bricolage-grotesque/opsz.css" />
<link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/wght.css" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0f0f0f; }
  body {
    position: relative; box-sizing: border-box; padding: 72px 80px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: "Bricolage Grotesque Variable", sans-serif; color: #fafafa;
    background-image: radial-gradient(#5a5a5a 1px, transparent 1.4px);
    background-size: 120px 120px; background-position: 11px 41px;
  }
  .eyebrow { font: 500 18px "JetBrains Mono Variable", monospace; letter-spacing: .16em; text-transform: uppercase; color: #fc7a1e; }
  h1 { margin: 0; font-weight: 800; font-size: 112px; line-height: .86; letter-spacing: -.05em; }
  h1 span { display: block; color: #5a5a5a; }
  .rule { height: 2px; background: #fc7a1e; width: 260px; margin: 34px 0 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; font: 400 18px "JetBrains Mono Variable", monospace; letter-spacing: .14em; text-transform: uppercase; color: #8a8a8a; border-top: 1px solid rgba(250,250,250,.12); padding-top: 26px; }
  .mark { width: 56px; height: 56px; }
</style>
</head>
<body>
  <div class="eyebrow">Portfolio — 2026</div>
  <div>
    <h1>Mümin Celal Pinar<span>makes fast, durable products</span></h1>
    <div class="rule"></div>
  </div>
  <div class="foot">
    <span>Product engineer</span>
    <span>Portfolio</span>
  </div>
</body>
</html>
